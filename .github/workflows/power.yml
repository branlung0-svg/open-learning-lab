name: power-data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    paths: ['tools/build_power.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python tools/build_power.py
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add data/power.json plan/power-debug.json; git commit -m "Power data: leaders, ministers and legislatures for every country (Wikidata, Wikipedia)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
