name: lesson-media
on:
  workflow_dispatch:
  push:
    paths: ['tools/fetch_lesson_media.py', 'lessons/src/**']
concurrency:
  group: lesson-media-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - run: python tools/fetch_lesson_media.py c:math-l
      - name: Commit lesson pictures
        run: |
          git config user.name "lab-media-bot"
          git config user.email "lab-media-bot@users.noreply.github.com"
          git add img/c data/commons.json
          git diff --cached --quiet || (git commit -m "Lesson media: local copies of lesson pictures (credits in data/commons.json)" && git pull --rebase && git push)
