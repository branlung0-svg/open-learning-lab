name: cors-check
on:
  push:
    paths: ['tools/cors_check.py']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python tools/cors_check.py
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add plan/cors-check.json; git commit -m "CORS check of open archive APIs" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
