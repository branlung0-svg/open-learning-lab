name: review-linked-media
on:
  workflow_dispatch:
  push:
    paths: ['tools/review_linked.py']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - run: python tools/review_linked.py
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add plan/review
          git commit -m "Review: link check and contact sheets for linked pictures" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
